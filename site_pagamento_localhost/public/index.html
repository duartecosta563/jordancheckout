<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <div class="brand">PAGAMENTO</div>
    <h1>Finalizar pagamento</h1>
    <p class="subtitle">Digite abaixo o valor pedido pelo vendedor</p>

    <form id="paymentForm">
      <label for="nome">Nome</label>
      <input id="nome" autocomplete="name" required placeholder="Nome completo">

      <label for="valor">Valor (€)</label>
      <input id="valor" inputmode="decimal" required placeholder="10,00">

      <label for="cartao">Cartão de Crédito</label>
      <input id="cartao" inputmode="numeric" maxlength="19" required placeholder="4242 4242 4242 4242">

      <div class="row">
        <div>
          <label for="validade">Validade</label>
          <input id="validade" inputmode="numeric" maxlength="5" required placeholder="MM/AA">
        </div>
        <div>
          <label for="cvv">CVV</label>
          <input id="cvv" inputmode="numeric" maxlength="4" required placeholder="123">
        </div>
      </div>

      <button type="submit">Pagar agora</button>
      <p id="mensagem" class="mensagem"></p>
    </form>

    <div class="aviso">
      O servidor guarda apenas o valor e o nome do cliente.
    </div>
  </main>

  <script>
    const form = document.getElementById('paymentForm');
    const cartao = document.getElementById('cartao');
    const validade = document.getElementById('validade');
    const cvv = document.getElementById('cvv');
    const mensagem = document.getElementById('mensagem');

    cartao.addEventListener('input', () => {
      let v = cartao.value.replace(/\D/g, '').slice(0, 16);
      cartao.value = v.replace(/(.{4})/g, '$1 ').trim();
    });

    validade.addEventListener('input', () => {
      let v = validade.value.replace(/\D/g, '').slice(0, 4);
      if (v.length >= 3) v = v.slice(0, 2) + '/' + v.slice(2);
      validade.value = v;
    });

    cvv.addEventListener('input', () => {
      cvv.value = cvv.value.replace(/\D/g, '').slice(0, 4);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      mensagem.textContent = 'A processar...';

      const numero = cartao.value.replace(/\D/g, '');
      const nome = document.getElementById('nome').value.trim();
      const valor = document.getElementById('valor').value.trim();
      const validadeValor = validade.value.trim();
      const cvvValor = cvv.value.trim();

      if (numero.length !== 16) {
        mensagem.textContent = 'Use um cartão de teste com 16 dígitos.';
        return;
      }

      if (!validadeValor || !cvvValor) {
        mensagem.textContent = 'Preencha a validade e o CVV.';
        return;
      }

      try {
        const resposta = await fetch('/api/pagamento', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nome,
            valor,
            cartao: numero,
            validade: validadeValor,
            cvv: cvvValor
          })
        });

        const resultado = await resposta.json();

        if (!resultado.ok) throw new Error(resultado.erro || 'Erro');

        mensagem.textContent = `Pagamento realizado com sucesso. ID: ${resultado.id}`;
        form.reset();
      } catch (erro) {
        mensagem.textContent = 'Não foi possível registar o pagamento.';
      }
    });
  </script>
</body>
</html>
